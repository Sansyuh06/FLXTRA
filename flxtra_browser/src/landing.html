<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flextra - The Future Browser</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #0a0a0c;
            color: #f4f4f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 800px;
        }

        /* Logo Container */
        .logo-wrap {
            position: relative;
            margin-bottom: 3rem;
        }



        /* Tagline */
        .tagline {
            font-size: 1.25rem;
            color: #a1a1aa;
            margin-bottom: 2.5rem;
            opacity: 0;
            animation: fadeUp 1s ease 1.5s forwards;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* CTA Button */
        .cta {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            opacity: 0;
            animation: fadeUp 1s ease 2s forwards;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(79, 70, 229, 0.4);
        }

        /* Floating particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #4f46e5;
            border-radius: 50%;
            opacity: 0.3;
            animation: float 20s linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.3;
            }

            90% {
                opacity: 0.3;
            }

            100% {
                transform: translateY(-100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Glitch Effect */
        .glitch-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .glitch {
            position: relative;
            font-size: 6rem;
            font-weight: 700;
            line-height: 1.2;
            color: #fff;
            letter-spacing: -4px;
            z-index: 1;
            animation: shift 4s ease-in-out infinite alternate;
        }

        .glitch:before,
        .glitch:after {
            display: block;
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0.8;
        }

        .glitch:before {
            animation: glitch-it 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite;
            color: #4f46e5;
            z-index: -1;
        }

        .glitch:after {
            animation: glitch-it 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) reverse both infinite;
            color: #ef4444;
            z-index: -2;
        }

        @keyframes glitch-it {
            0% {
                transform: translate(0)
            }

            20% {
                transform: translate(-2px, 2px)
            }

            40% {
                transform: translate(-2px, -2px)
            }

            60% {
                transform: translate(2px, 2px)
            }

            80% {
                transform: translate(2px, -2px)
            }

            100% {
                transform: translate(0)
            }
        }

        @keyframes shift {

            0%,
            40%,
            44%,
            58%,
            61%,
            65%,
            69%,
            73%,
            100% {
                transform: skewX(0deg);
            }

            41% {
                transform: skewX(10deg);
            }

            42% {
                transform: skewX(-10deg);
            }

            59% {
                transform: skewX(40deg) skewY(10deg);
            }

            60% {
                transform: skewX(-40deg) skewY(-10deg);
            }

            63% {
                transform: skewX(10deg) skewY(-5deg);
            }

            70% {
                transform: skewX(-50deg) skewY(-20deg);
            }

            71% {
                transform: skewX(10deg) skewY(-10deg);
            }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .glitch {
                font-size: 3rem;
            }

            .tagline {
                font-size: 1rem;
                padding: 0 1rem;
            }

            .cta {
                padding: 0.875rem 1.5rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>

<body>
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="logo-wrap">
            <div class="glitch-wrapper">
                <div class="glitch" data-text="FLEXTRA">FLEXTRA</div>
            </div>
        </div>

        <p class="tagline">AI-Native. Privacy-First. The Web, Evolved.</p>

        <a href="https://en.wikipedia.org/wiki/Special:Random" class="cta">
            <span>Start Exploring</span>
            <span>→</span>
        </a>
    </div>

    <script>
        // Generate floating particles
        const particles = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDelay = Math.random() * 20 + 's';
            p.style.animationDuration = (15 + Math.random() * 10) + 's';
            particles.appendChild(p);
        }
    </script>
</body>

</html>
