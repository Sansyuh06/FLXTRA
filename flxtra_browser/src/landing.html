<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flextra - The Future Browser</title>
    <!-- Load variable font that supports wght and wdth axes -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #030014;
            color: #f4f4f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #galaxy-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 900px;
            z-index: 10;
            position: relative;
        }

        /* Text Pressure - Exact ReactBits Style */
        .text-pressure-container {
            position: relative;
            width: 100%;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
            cursor: default;
        }

        .text-pressure-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .text-pressure-svg text {
            font-family: 'Inter', sans-serif;
            font-weight: 100;
            font-stretch: 100%;
            fill: #ffffff;
            dominant-baseline: middle;
            text-anchor: middle;
        }

        .tagline {
            font-size: 1.25rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 3rem;
            font-weight: 300;
            letter-spacing: 0.05em;
        }

        .cta {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 2.5rem;
            background: linear-gradient(135deg, #7c3aed 0%, #ec4899 100%);
            border: none;
            border-radius: 50px;
            color: #fff;
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 30px rgba(124, 58, 237, 0.4);
        }

        .cta:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 50px rgba(124, 58, 237, 0.6);
        }
    </style>
</head>

<body>
    <canvas id="galaxy-canvas"></canvas>

    <div class="container">
        <div class="text-pressure-container" id="text-container">
            <svg class="text-pressure-svg" id="text-svg" preserveAspectRatio="xMidYMid meet">
                <!-- Characters inserted by JS -->
            </svg>
        </div>
        <p class="tagline">AI-Native. Privacy-First. The Web, Evolved.</p>
        <a href="https://en.wikipedia.org/wiki/Special:Random" class="cta">
            <span>Start Exploring</span>
            <span>→</span>
        </a>
    </div>

    <script>
        // ============ GALAXY BACKGROUND ============
        const canvas = document.getElementById('galaxy-canvas');
        const gl = canvas.getContext('webgl');

        if (gl) {
            const vs = `
            attribute vec2 p;
            varying vec2 v;
            void main(){v=p*.5+.5;gl_Position=vec4(p,0,1);}
        `;
            const fs = `
            precision highp float;
            uniform float t;
            uniform vec2 r;
            uniform vec2 m;
            varying vec2 v;

            float h(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
            
            float star(vec2 u,float f){
                float d=length(u);
                float s=.05/d;
                s+=max(0.,1.-abs(u.x*u.y*1000.))*f;
                return s*smoothstep(1.,.2,d);
            }

            vec3 layer(vec2 u,float t){
                vec3 c=vec3(0);
                vec2 g=fract(u)-.5,id=floor(u);
                for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){
                    vec2 o=vec2(x,y);
                    float n=h(id+o);
                    float sz=fract(n*345.32);
                    vec2 sp=vec2(n,fract(n*34.))-.5;
                    sp+=sin(t*(n*2.+1.))*.1;
                    float s=star(g-o-sp,smoothstep(.8,1.,sz)*.5);
                    vec3 col=vec3(.9,.7,1.);
                    c+=s*sz*col;
                }
                return c;
            }

            void main(){
                vec2 u=(v-.5)*vec2(r.x/r.y,1.);
                vec2 mu=(m-.5)*vec2(r.x/r.y,1.);
                float md=length(u-mu);
                u+=normalize(u-mu)*(.3/(md+.5))*.1;
                float a=t*.02;
                mat2 rot=mat2(cos(a),-sin(a),sin(a),cos(a));
                u*=rot;
                vec3 c=vec3(0);
                for(float i=0.;i<4.;i++){
                    float d=fract(i/4.+t*.05);
                    float sc=mix(20.,1.,d);
                    c+=layer(u*sc+i*100.,t)*d*smoothstep(1.,.9,d)*.5;
                }
                c+=vec3(.1,0.,.2)*(1.-length(u)*.5);
                gl_FragColor=vec4(c,1);
            }
        `;

            function compile(t, s) { const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh); return sh; }
            const prog = gl.createProgram();
            gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
            gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
            gl.linkProgram(prog);

            const buf = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buf);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

            const pLoc = gl.getAttribLocation(prog, 'p');
            const tLoc = gl.getUniformLocation(prog, 't');
            const rLoc = gl.getUniformLocation(prog, 'r');
            const mLoc = gl.getUniformLocation(prog, 'm');

            let mouse = { x: .5, y: .5 }, sm = { x: .5, y: .5 };
            document.addEventListener('mousemove', e => { mouse.x = e.clientX / innerWidth; mouse.y = 1 - e.clientY / innerHeight; });

            function resize() { canvas.width = innerWidth; canvas.height = innerHeight; gl.viewport(0, 0, canvas.width, canvas.height); }
            addEventListener('resize', resize); resize();

            function draw(t) {
                t *= .001;
                sm.x += (mouse.x - sm.x) * .05;
                sm.y += (mouse.y - sm.y) * .05;
                gl.useProgram(prog);
                gl.enableVertexAttribArray(pLoc);
                gl.bindBuffer(gl.ARRAY_BUFFER, buf);
                gl.vertexAttribPointer(pLoc, 2, gl.FLOAT, false, 0, 0);
                gl.uniform1f(tLoc, t);
                gl.uniform2f(rLoc, canvas.width, canvas.height);
                gl.uniform2f(mLoc, sm.x, sm.y);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                requestAnimationFrame(draw);
            }
            requestAnimationFrame(draw);
        }

        // ============ TEXT PRESSURE (Exact ReactBits Implementation) ============
        const text = "FLEXTRA";
        const container = document.getElementById('text-container');
        const svg = document.getElementById('text-svg');

        // Set viewBox based on container
        const fontSize = 120;
        const spacing = fontSize * 0.75;
        const totalWidth = text.length * spacing;
        svg.setAttribute('viewBox', `0 0 ${totalWidth} ${fontSize * 1.5}`);

        // Create text elements
        const chars = text.split('').map((char, i) => {
            const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            t.setAttribute('x', spacing * (i + 0.5));
            t.setAttribute('y', fontSize);
            t.setAttribute('font-size', fontSize);
            t.setAttribute('data-index', i);
            t.textContent = char;
            svg.appendChild(t);
            return t;
        });

        // Track mouse position relative to container
        let mouseX = 0, mouseY = 0;
        let isHovering = false;

        container.addEventListener('mouseenter', () => { isHovering = true; });
        container.addEventListener('mouseleave', () => {
            isHovering = false;
            // Animate back to default
            chars.forEach(c => {
                c.dataset.targetWeight = 100;
                c.dataset.targetWidth = 100;
            });
        });

        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        // Store current values for smooth animation
        chars.forEach(c => {
            c.dataset.weight = 100;
            c.dataset.width = 100;
            c.dataset.targetWeight = 100;
            c.dataset.targetWidth = 100;
        });

        function updatePressure() {
            if (!isHovering) {
                // Smoothly return to default
                chars.forEach(c => {
                    c.dataset.targetWeight = 100;
                    c.dataset.targetWidth = 100;
                });
            } else {
                const rect = container.getBoundingClientRect();
                const svgRect = svg.getBoundingClientRect();

                chars.forEach((c, i) => {
                    // Calculate character center in screen coords
                    const charX = svgRect.left + (spacing * (i + 0.5)) / totalWidth * svgRect.width;
                    const charY = svgRect.top + svgRect.height / 2;

                    // Distance from mouse to character center
                    const dx = mouseX + rect.left - charX;
                    const dy = mouseY + rect.top - charY;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    // Proximity factor (closer = higher)
                    const maxDist = 150;
                    const proximity = Math.max(0, 1 - distance / maxDist);

                    // Map proximity to weight (100 to 900) and width (75 to 125)
                    c.dataset.targetWeight = 100 + proximity * 800;
                    c.dataset.targetWidth = 100 + proximity * 25;
                });
            }

            // Smooth interpolation
            chars.forEach(c => {
                const currentWeight = parseFloat(c.dataset.weight);
                const targetWeight = parseFloat(c.dataset.targetWeight);
                const newWeight = currentWeight + (targetWeight - currentWeight) * 0.15;
                c.dataset.weight = newWeight;

                const currentWidth = parseFloat(c.dataset.width);
                const targetWidth = parseFloat(c.dataset.targetWidth);
                const newWidth = currentWidth + (targetWidth - currentWidth) * 0.15;
                c.dataset.width = newWidth;

                c.style.fontWeight = Math.round(newWeight);
                c.style.fontStretch = newWidth + '%';
            });

            requestAnimationFrame(updatePressure);
        }
        updatePressure();
    </script>
</body>

</html>
